<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Starting The Fixer...</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111318;
    color: #e6e6ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    user-select: none;
  }
  .wrap {
    text-align: center;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 18px;
    border: 3px solid rgba(230, 230, 234, 0.15);
    border-top-color: #e6e6ea;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  p {
    font-size: 12.5px;
    color: #9a9aa4;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Starting The Fixer</h1>
    <p>Launching the audio engine&hellip;</p>
  </div>
</body>
</html>
